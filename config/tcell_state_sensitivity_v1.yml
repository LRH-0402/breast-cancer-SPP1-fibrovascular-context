version: 1
analysis_status: "post_hoc_interpretive_boundary"
freeze_date: "2026-07-23"
purpose: >-
  Test whether CD8/cytotoxic coexistence around P4-high spatial spots can be
  interpreted as effective antitumor immunity. These mixed-spot signatures
  describe state-associated expression and do not establish T-cell clonality,
  antigen specificity, or tumor-cell killing.

tcell_state_signatures:
  tcell_exhaustion:
    - PDCD1
    - HAVCR2
    - LAG3
    - TIGIT
    - CTLA4
    - TOX
    - ENTPD1
  tcell_ifng_response:
    - IFNG
    - CXCL9
    - CXCL10
    - STAT1
    - IRF1
    - GBP1
  tcell_progenitor:
    - TCF7
    - LEF1
    - IL7R
    - CCR7
    - LTB
    - SLAMF6

reporting_boundary: >-
  Report patient- or section-level directional effects, cohort permutation
  tests, coverage, and multiplicity adjustment. Do not label a mixed spatial
  spot as an exhausted or progenitor T cell.
